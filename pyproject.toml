[project]
name = "kindle-aws-dashboard"
version = "0.1.0"
description = "Serverless AWS FinOps dashboard rendered for a Kindle Paperwhite 3"
requires-python = ">=3.14,<3.15"
# Runtime deps of the renderer Lambda. boto3 comes from the Lambda runtime.
dependencies = ["pillow", "tzdata"]

[dependency-groups]
dev = [
    "boto3>=1.43.118",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["lambdas/renderer"]
testpaths = ["lambdas/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"lambdas/tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["collect", "render"]
